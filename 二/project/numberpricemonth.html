<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>农作物产量、价格与月份关系</title>
    <script src="echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #F1F8F1;
            padding: 20px;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #chart {
            width: 100%;
            height: 450px;
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div id="chart"></div>
    <script>
        const myChart = echarts.init(document.getElementById('chart'));
        const option = {
            backgroundColor: 'transparent',
            title: {
                text: '农作物产量、价格与月份关系',
                left: 'center',
                top: 10, 
                textStyle: {
                    color: '#2E7D32',
                    fontSize: 20,
                    fontWeight: 'bold'
                }
            },
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'cross'
                }
            },
            legend: {
                data: ['主粮作物', '经济作物'],
                top: 45, 
                textStyle: {
                    color: '#555',
                    fontSize: 14
                }
            },
            grid: {
                left: '10%',
                right: '10%',
                top: '18%', 
                bottom: '15%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: ['1月','2月','3月','4月','5月','6月','7月'],
                axisLabel: {
                    color: '#666',
                    fontSize: 14
                },
                axisLine: {
                    lineStyle: {
                        color: '#aaa'
                    }
                }
            },
            yAxis: {
                type: 'value',
                name: '产量(万吨)',
                nameTextStyle: {
                    color: '#666',
                    fontSize: 14
                },
                axisLabel: {
                    color: '#666',
                    fontSize: 14
                },
                splitLine: {
                    lineStyle: {
                        color: '#ddd'
                    }
                }
            },
            series: [
                {
                    name: '主粮作物',
                    type: 'scatter',
                    symbolSize: function (val) {
                        return val[1] / 200;
                    },
                    data: [
                        ['1月', 3000], ['2月', 4000], ['3月', 5200], ['4月', 6500],
                        ['5月', 6800], ['6月', 7200], ['7月', 8000]
                    ],
                    itemStyle: {
                        color: '#4CAF50',
                        opacity: 0.7
                    }
                },
                {
                    name: '经济作物',
                    type: 'scatter',
                    symbolSize: function (val) {
                        return val[1] / 100;
                    },
                    data: [
                        ['1月', 1200], ['2月', 1500], ['3月', 1800], ['4月', 2200],
                        ['5月', 2000], ['6月', 2300], ['7月', 2500]
                    ],
                    itemStyle: {
                        color: '#81C784',
                        opacity: 0.7
                    }
                }
            ]
        };
        myChart.setOption(option);
        window.onresize = () => myChart.resize();
    </script>
</body>
</html>
