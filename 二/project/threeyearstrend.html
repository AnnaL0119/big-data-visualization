<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>近三年农作物产量趋势分析</title>
    <script src="echarts.min.js"></script>
    <style>
        body { background: #F1F8F1; padding: 20px; margin: 0; }
        #chart { width: 100%; 
            height: 400px; 
            background: #fff; 
            border-radius: 8px;
            padding: 10px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div id="chart"></div>
    <script>
        const myChart = echarts.init(document.getElementById('chart'));
        const option = {
            backgroundColor: 'transparent',
            title: { text: '近三年农作物产量趋势分析',
                     top:10,
                     left: 'center',
                     textStyle: { color: '#2E7D32' }
             },
            tooltip: { trigger: 'axis' },
            legend: { data: ['2024年','2023年','2022年'],
                    top: 40,
                    textStyle: { color: '#555' } 
            },
            grid: { left: '3%', 
                    right: '4%',
                    bottom: '3%',
                    containLabel: true 
            },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
                axisLabel: { color: '#666' }
            },
            yAxis: {
                type: 'value',
                name: '产量(万吨)',
                axisLabel: { color: '#666' },
                splitLine: { lineStyle: { color: '#ddd' } }
            },
            series: [
                {
                    name: '2024年',
                    type: 'line',
                    stack: 'Total',
                    areaStyle: { color: 'rgba(46,125,50,0.3)' },
                    lineStyle: { color: '#2E7D32' },
                    itemStyle: { color: '#2E7D32' },
                    data: [1500,2000,2800,3200,3800,4200,4500,4700,4500,4800,4200,3000]
                },
                {
                    name: '2023年',
                    type: 'line',
                    stack: 'Total',
                    areaStyle: { color: 'rgba(76,175,80,0.3)' },
                    lineStyle: { color: '#4CAF50' },
                    itemStyle: { color: '#4CAF50' },
                    data: [2000,2600,3500,4000,4800,5300,5800,6200,6000,6500,5500,4000]
                },
                {
                    name: '2022年',
                    type: 'line',
                    stack: 'Total',
                    areaStyle: { color: 'rgba(129,199,132,0.3)' },
                    lineStyle: { color: '#81C784' },
                    itemStyle: { color: '#81C784' },
                    data: [2500,3200,4200,4800,5700,6300,7000,7600,7300,8000,6800,5000]
                }
            ]
        };
        myChart.setOption(option);
        window.onresize = () => myChart.resize();
    </script>
</body>
</html>
