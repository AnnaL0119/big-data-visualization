<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>作物综合评分对比</title>
    <script src="echarts.min.js"></script>
    <style>
        body { background: #F1F8F1; padding: 20px; margin: 0; }
        #chart { width: 100%;
            height: 400px; 
            background: #fff;
            border-radius: 8px; 
            padding: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div id="chart"></div>
    <script>
        const myChart = echarts.init(document.getElementById('chart'));
        const option = {
            backgroundColor: 'transparent',
            title: { text: '作物综合评分对比', 
            top:10,
            left: 'center', 
            textStyle: { color: '#2E7D32' } 
        },
            tooltip: {},
            legend: { data: ['水稻','小麦','玉米'],
            top: 40, 
            textStyle: { color: '#555' }
            },
            radar: {
                indicator: [
                    { name: '产量稳定性', max: 100 },
                    { name: '市场价格', max: 100 },
                    { name: '种植成本', max: 100 },
                    { name: '病虫害抗性', max: 100 },
                    { name: '气候适应性', max: 100 },
                    { name: '加工利用率', max: 100 }
                ],
                splitArea: { areaStyle: { color: ['rgba(76,175,80,0.05)'] } },
                axisLine: { lineStyle: { color: '#ccc' } },
                splitLine: { lineStyle: { color: '#ccc' } }
            },
            series: [{
                type: 'radar',
                data: [
                    { value: [90,85,70,88,92,80], name: '水稻', areaStyle: { color: 'rgba(46,125,50,0.3)' }, lineStyle: { color: '#2E7D32' }, itemStyle: { color: '#2E7D32' } },
                    { value: [85,75,85,80,85,85], name: '小麦', areaStyle: { color: 'rgba(76,175,80,0.3)' }, lineStyle: { color: '#4CAF50' }, itemStyle: { color: '#4CAF50' } },
                    { value: [92,80,75,90,88,90], name: '玉米', areaStyle: { color: 'rgba(129,199,132,0.3)' }, lineStyle: { color: '#81C784' }, itemStyle: { color: '#81C784' } }
                ]
            }]
        };
        myChart.setOption(option);
        window.onresize = () => myChart.resize();
    </script>
</body>
</html>
